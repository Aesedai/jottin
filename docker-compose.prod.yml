# Production stack for one server. Secrets come from a .env file on the server:
# DB_PASSWORD, DB_ROOT_PASSWORD and ENCRYPTION_KEY. See docs/DEPLOY-AWS.md.
#
# There is no demo receiver and no JOTTIN_ALLOW_PRIVATE_WEBHOOKS here, and MySQL is
# reachable only from these containers.
x-app-environment: &app-environment
  CI_ENVIRONMENT: production
  app_baseURL: https://jottin.app/
  app_forceGlobalSecureRequests: "true"
  # Only Caddy can reach the app, so its X-Forwarded-For header is the real client IP.
  JOTTIN_TRUSTED_PROXY: 172.30.0.0/24
  database_default_hostname: db
  database_default_database: jottin
  database_default_username: jottin
  database_default_password: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  encryption_key: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      target: prod
    image: jottin-app:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-environment

  worker:
    image: jottin-app:prod
    command: php spark deliveries:run --loop
    user: www-data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment: *app-environment

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jottin
      MYSQL_USER: jottin
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: >-
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
      --log-bin-trust-function-creators=1 --innodb-buffer-pool-size=256M
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
