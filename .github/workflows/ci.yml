name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --no-banner

  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer analyse

  tests:
    name: PHPUnit (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: jottin_test
          MYSQL_USER: jottin
          MYSQL_PASSWORD: ci-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only --silent"
          --health-interval=3s --health-timeout=3s --health-retries=30
    env:
      database_default_hostname: 127.0.0.1
      database_default_database: jottin_test
      database_default_username: jottin
      database_default_password: ci-only
      database_tests_hostname: 127.0.0.1
      database_tests_database: jottin_test
      database_tests_username: jottin
      database_tests_password: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Allow the non-root user to create the audit log triggers
        run: >-
          docker exec "$(docker ps -q --filter ancestor=mysql:8.0)"
          mysql -uroot -pci-only -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: composer test

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t jottin:ci .
      - name: Check the production Compose file
        run: docker compose -f docker-compose.prod.yml config --quiet
        env:
          DB_PASSWORD: ci-only
          DB_ROOT_PASSWORD: ci-only
          ENCRYPTION_KEY: ci-only
